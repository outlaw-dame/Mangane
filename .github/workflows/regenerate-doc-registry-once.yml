name: Regenerate documentation registry once

on:
  push:
    branches:
      - agent/document-fedibuzz-and-durable-streams

permissions:
  contents: write

concurrency:
  group: regenerate-doc-registry-once
  cancel-in-progress: true

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: agent/document-fedibuzz-and-durable-streams
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 18.20.8
      - run: node scripts/generate-documentation-authority-registry.js
      - run: node scripts/check-documentation-authority.js
      - run: node --test scripts/__tests__/check-documentation-authority.test.js
      - name: Commit regenerated registry
        run: |
          if git diff --quiet -- config/documentation-authority-registry.json; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add config/documentation-authority-registry.json
          git commit -m 'Regenerate documentation authority registry'
          git push origin HEAD:agent/document-fedibuzz-and-durable-streams
