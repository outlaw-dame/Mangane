name: Temporary PR87 review fix

on:
  push:
    branches:
      - feat/featured-hashtags

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[pr87-review-fixed]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/featured-hashtags
          fetch-depth: 0
      - name: Decouple hashtag navigation from follow-tag support
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              Path('app/soapbox/components/sidebar-navigation.tsx'): (
                  "            {\n              features.followTags && (\n                <SidebarNavigationLink\n                  to='/followed_hashtags'\n                  icon={require('@tabler/icons/hash.svg')}\n                  text={<FormattedMessage id='navigation_bar.tags' defaultMessage='Hashtags' />}\n                />\n              )\n            }",
                  "            <SidebarNavigationLink\n              to='/followed_hashtags'\n              icon={require('@tabler/icons/hash.svg')}\n              text={<FormattedMessage id='navigation_bar.tags' defaultMessage='Hashtags' />}\n            />",
              ),
              Path('app/soapbox/components/sidebar_menu.tsx'): (
                  "                    {\n                      features.followTags && (\n                        <SidebarLink\n                          onClick={onClose}\n                          to='/followed_hashtags'\n                          icon={require('@tabler/icons/hash.svg')}\n                          text={<FormattedMessage id='navigation_bar.tags' defaultMessage='Hashtags' />}\n                        />\n                      )\n                    }",
                  "                    <SidebarLink\n                      onClick={onClose}\n                      to='/followed_hashtags'\n                      icon={require('@tabler/icons/hash.svg')}\n                      text={<FormattedMessage id='navigation_bar.tags' defaultMessage='Hashtags' />}\n                    />",
              ),
          }

          for path, (old, new) in replacements.items():
              text = path.read_text()
              if old not in text:
                  raise SystemExit(f'expected navigation block not found in {path}')
              path.write_text(text.replace(old, new, 1))

          Path('.github/workflows/temp-pr87-review-fix.yml').unlink()
          PY
      - name: Commit review fixes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/soapbox/components/sidebar-navigation.tsx app/soapbox/components/sidebar_menu.tsx .github/workflows/temp-pr87-review-fix.yml
          git commit -m "fix: expose featured hashtags independently [pr87-review-fixed]"
          git push origin HEAD:feat/featured-hashtags
