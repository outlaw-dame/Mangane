name: Integrate creator attribution once

on:
  push:
    branches:
      - agent/document-creator-attribution

permissions:
  contents: write

concurrency:
  group: integrate-creator-attribution-once
  cancel-in-progress: true

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: agent/document-creator-attribution
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 18.20.8
      - name: Integrate canonical documents
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          const adrPath = 'docs/architecture/ARCHITECTURAL_DECISIONS.md';
          let adr = fs.readFileSync(adrPath, 'utf8');
          const decision = `## ADR-028 — Link creator attribution is distinct, proof-tiered derived metadata\n\nStatus: Accepted\n\nDate: 2026-07-29\n\nDecision: Add Phase 8B for creator attribution inside external link previews. Native Mastodon PreviewCard.authors data is normalized first, legacy author fields remain fallback inputs, and other supported platforms may expose conventional creator bylines through adapters. A Fediverse account is shown as verified creator attribution only when the connected server supplied a verified account or Mangane independently proved that the publication domain is authorized by the resolved account. Status authorship, linked-work creation, and publication/provider identity remain separate.\n\nContext: Mastodon 4.3 introduced the fediverse:creator feature and PreviewCard.authors API, while Mastodon 4.6 added missing_attribution and newer profile attribution-domain APIs. Akkoma, Pleroma, and older Mastodon-compatible servers may supply only legacy metadata or no creator account. A browser PWA also cannot safely or reliably fetch arbitrary article HTML without CORS or a hardened resolver.\n\nAlternatives considered: support Mastodon only; trust any fediverse:creator tag; treat rel=me as equivalent proof; replace the status author with the article creator; run a generic open proxy; omit creator attribution on unsupported platforms.\n\nRationale: A normalized, proof-tiered model gives Mangane broad creator bylines while preventing malicious publications from framing unrelated Fediverse accounts. Native support remains simple and external resolution remains optional and separately hardened.\n\nConsequences and tradeoffs: The feature adds preview schema migration, multiple-author UI, account deduplication, proof freshness, profile-setting capability checks, and optional resolver complexity. Metadata-only creator names must remain visibly distinct from verified account attribution.\n\nSecurity/privacy impact: All URLs, redirects, actor lookups, domains, bodies, schemas, and caches are bounded and validated. Tokens and cookies never go to publication or creator servers. External resolution defaults off, raw HTML is not persisted, and proof fails closed.\n\nMigration/rollback: Native and legacy fields migrate additively into one canonical preview authority. Rollback disables enrichment and account actions while preserving ordinary preview cards, provider data, server profile settings, and canonical statuses.\n\n`;
          if (!adr.includes('## ADR-028 —')) {
            adr = adr.replace('## ADR template', decision + '## ADR template');
            fs.writeFileSync(adrPath, adr);
          }

          const readmePath = 'docs/architecture/README.md';
          let readme = fs.readFileSync(readmePath, 'utf8');
          const marker = '## Active and accepted phase plans\n\n';
          const bullet = '- [`PHASE_8B_CREATOR_ATTRIBUTION.md`](./PHASE_8B_CREATOR_ATTRIBUTION.md) defines native Mastodon `fediverse:creator`/`PreviewCard.authors` support and cross-platform creator bylines, including proof tiers, multiple authors, canonical-account deduplication, attribution-domain settings, safe optional metadata resolution, privacy, rollback, and adversarial gates.\n';
          if (!readme.includes('PHASE_8B_CREATOR_ATTRIBUTION.md')) {
            readme = readme.replace(marker, marker + bullet);
            fs.writeFileSync(readmePath, readme);
          }

          const roadmapPath = 'docs/architecture/IMPLEMENTATION_ROADMAP_V2.md';
          let roadmap = fs.readFileSync(roadmapPath, 'utf8');
          const tableMarker = '| Phase 8 — Home and For You editorial migration | Queued | [`PHASE_8_HOME_AND_BUILT_IN_FEEDS.md`](./PHASE_8_HOME_AND_BUILT_IN_FEEDS.md) |\n';
          const tableRow = '| Phase 8B — Creator Attribution | Queued | [`PHASE_8B_CREATOR_ATTRIBUTION.md`](./PHASE_8B_CREATOR_ATTRIBUTION.md) |\n';
          if (!roadmap.includes('| Phase 8B — Creator Attribution |')) {
            roadmap = roadmap.replace(tableMarker, tableMarker + tableRow);
          }
          const phase9 = '## Phase 9 —';
          const section = `## Phase 8B — Creator Attribution\n\nStatus: **Queued; see [\`PHASE_8B_CREATOR_ATTRIBUTION.md\`](./PHASE_8B_CREATOR_ATTRIBUTION.md).**\n\nGoal: display accurate linked-work creator bylines and verified Fediverse creator accounts in link previews without confusing them with the author of the sharing status.\n\nDeliverables:\n\n- verified inventory of preview-card schemas, renderers, storage authorities, and supported backend fixtures;\n- native Mastodon PreviewCard.authors and missing_attribution normalization;\n- legacy author_name/author_url and platform-specific metadata fallback;\n- multiple-author canonical model and deterministic account/resource deduplication;\n- proof-tiered distinction between metadata-only, unverified claims, native server verification, and independently verified domain/account attribution;\n- shared creator byline presentation across post cards, bookmarks, Search, Explore, conversations, and Gist evidence;\n- capability-gated Mastodon attribution-domain profile settings;\n- optional later direct-CORS or hardened trusted-resolver enrichment for servers without native support;\n- URL, redirect, SSRF, WebFinger, actor, IDNA, privacy, cache, migration, rollback, accessibility, and performance gates.\n\nExit criteria:\n\n- status author, linked-work creator, and publication remain distinct;\n- one resource/creator identity does not create duplicate bylines or account records;\n- native and legacy responses degrade without breaking link previews;\n- an arbitrary publication cannot attribute itself to an unrelated Fediverse account;\n- external resolution is absent or passes all hardened resolver gates;\n- account isolation, moderation, moves, suspension, offline, migration, rollback, accessibility, and performance tests pass.\n\n`;
          if (!roadmap.includes('## Phase 8B — Creator Attribution')) {
            roadmap = roadmap.replace(phase9, section + phase9);
          }
          fs.writeFileSync(roadmapPath, roadmap);
          NODE
      - run: node scripts/generate-documentation-authority-registry.js
      - run: node scripts/check-documentation-authority.js
      - run: node --test scripts/__tests__/check-documentation-authority.test.js
      - name: Commit integrated documentation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/architecture/ARCHITECTURAL_DECISIONS.md docs/architecture/README.md docs/architecture/IMPLEMENTATION_ROADMAP_V2.md config/documentation-authority-registry.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Integrate creator attribution phase'
          git push origin HEAD:agent/document-creator-attribution

# Trigger integration after workflow registration.
