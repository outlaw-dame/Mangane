name: Temporary regenerate authority

on:
  push:
    branches:
      - phase-3-4/closure-and-compression

permissions:
  contents: write

jobs:
  regenerate:
    if: ${{ !contains(github.event.head_commit.message, '[authority-generated]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-3-4/closure-and-compression
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - run: corepack enable
      - run: yarn install --immutable
      - name: Regenerate affected authority inventories
        run: |
          yarn generate:html-safety
          yarn generate:telemetry
          yarn generate:design-authority
          yarn generate:architecture-boundaries
          node scripts/generate-component-ownership-manifest.js
          yarn generate:documentation-authority
      - name: Commit generated inventories
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add config docs
          git commit -m "chore: regenerate affected authority inventories [authority-generated]"
          git push origin HEAD:phase-3-4/closure-and-compression
