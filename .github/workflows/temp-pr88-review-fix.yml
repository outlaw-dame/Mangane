name: Temporary PR88 review fix

on:
  push:
    branches:
      - docs/profile-walls-adaptive-thread-timelines

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[pr88-review-fixed]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/profile-walls-adaptive-thread-timelines
          fetch-depth: 0
      - name: Reconcile Phase 9A authorities
        run: |
          python - <<'PY'
          from pathlib import Path

          phase = Path('docs/architecture/PHASE_9A_PROFILE_WALLS_AND_ADAPTIVE_THREAD_TIMELINES.md')
          text = phase.read_text()
          text = text.replace(
              "  federationState: 'ordinary-status' | 'native-wall' | 'unknown';\n  createdAt: string;",
              "  federationState: 'ordinary-status' | 'native-wall' | 'unknown';\n  visibility: 'author-private' | 'recipient-visible' | 'public-native';\n  recipientEvidence: string | null;\n  createdAt: string;",
              1,
          )
          section = """### Recipient-visible placement authority\n\nA placement created only in the author's account-scoped repository is **author-private**. It can organize the author's own view, but it cannot drive the recipient's wall, wall policy, wall-specific notification, or a visitor's view. An ordinary federated mention is not evidence of recipient-visible placement.\n\nA placement becomes `recipient-visible` only through verified protocol-native wall metadata, or through an authenticated target-controlled synchronization channel carrying a signed, target-addressed claim bound to the canonical status. Such a claim is metadata only: it grants no status access, cannot override canonical visibility or moderation, must be replay-protected and revocable, and must be accepted in the recipient's canonical account scope.\n\nUntil such a channel is implemented and verified, another-profile composition on Mastodon-compatible platforms is **mention-only** for the recipient and visitors. Mangane may retain an explicitly labelled author-private record, **Saved to your Mangane view**, but must not describe it as appearing on the target's wall.\n\n"""
          marker = "### Composing to a profile\n"
          if section not in text and marker in text:
              text = text.replace(marker, section + marker, 1)
          text = text.replace(
              "- **Mangane wall placement:** Mangane publishes an ordinary compatible status and records the intended wall placement locally.",
              "- **Mangane wall placement:** recipient-visible only through verified target-addressed authority. Without it, Mangane publishes an ordinary mention and may keep only an explicitly labelled author-private record.",
              1,
          )
          text = text.replace(
              "- whether the action can create a local placement after confirmed publication.",
              "- whether confirmed publication creates only an author-private record or a verified recipient-visible placement.",
              1,
          )
          text = text.replace(
              "Mangane-only wall placements cannot be treated as globally public metadata. Another client may show only the underlying ordinary status.",
              "Author-private placements cannot affect the target or visitors. Recipient-visible placements require verified target-addressed evidence, and neither form is globally public metadata. Other clients may show only the underlying ordinary status.",
              1,
          )
          phase.write_text(text)

          readme = Path('docs/architecture/README.md')
          rtext = readme.read_text()
          entry = "- [`PHASE_9A_PROFILE_WALLS_AND_ADAPTIVE_THREAD_TIMELINES.md`](./PHASE_9A_PROFILE_WALLS_AND_ADAPTIVE_THREAD_TIMELINES.md) defines truthful profile-wall projections, recipient-visible placement authority, author-private fallback limits, and graph-aware chronological, newest-first, and adaptive thread presentation.\n"
          marker = "## Active and accepted phase plans\n\n"
          if entry not in rtext:
              rtext = rtext.replace(marker, marker + entry, 1)
              readme.write_text(rtext)

          roadmap = Path('docs/architecture/IMPLEMENTATION_ROADMAP_V2.md')
          if roadmap.exists():
              mtext = roadmap.read_text()
              entry = """### Phase 9A — Profile walls and adaptive thread timelines\n\n**Status:** Accepted target / queued.\n\nAfter Phase 9 establishes canonical conversation graphs, implement [`PHASE_9A_PROFILE_WALLS_AND_ADAPTIVE_THREAD_TIMELINES.md`](./PHASE_9A_PROFILE_WALLS_AND_ADAPTIVE_THREAD_TIMELINES.md). Author-private placement never appears to recipients or visitors; another-profile wall behavior requires verified recipient-visible authority or degrades to mention-only. Thread ordering remains a bounded presentation projection.\n\n"""
              if entry not in mtext:
                  marker10 = "## Phase 10"
                  mtext = mtext.replace(marker10, entry + marker10, 1) if marker10 in mtext else mtext + "\n\n" + entry
                  roadmap.write_text(mtext)

          adr = Path('docs/architecture/ARCHITECTURAL_DECISIONS.md')
          if adr.exists():
              atext = adr.read_text()
              entry = """\n\n## ADR — Profile walls are verified projections, not implied recipient state\n\n**Status:** Accepted\n\nA placement held only in the author's account scope is author-private and cannot affect the recipient, visitors, wall policy, or notifications. Recipient-visible placement requires protocol-native evidence or authenticated, signed, target-addressed synchronization accepted in the recipient's scope. Without that authority, another-profile composition degrades to an ordinary mention. Adaptive thread ordering never rewrites canonical timeline or conversation graph order.\n"""
              if "## ADR — Profile walls are verified projections" not in atext:
                  adr.write_text(atext.rstrip() + entry + "\n")

          Path('.github/workflows/temp-pr88-review-fix.yml').unlink()
          PY
      - name: Commit review fixes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "docs: reconcile Phase 9A authority and visibility [pr88-review-fixed]"
          git push origin HEAD:docs/profile-walls-adaptive-thread-timelines
