name: Temporary PR89 main synchronization

on:
  push:
    branches:
      - feat/collections-starter-kits-embeds

permissions:
  contents: write

jobs:
  sync:
    if: ${{ !contains(github.event.head_commit.message, '[pr89-main-synced]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/collections-starter-kits-embeds
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: yarn install --immutable
      - name: Merge current main and regenerate generated authorities
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin main
          git merge --no-edit -X ours origin/main
          rm -f .github/pr89-merge-conflicts.txt
          yarn generate:network-callsites
          yarn generate:html-safety
          yarn generate:telemetry
          yarn generate:design-authority
          yarn generate:architecture-boundaries
          yarn generate:documentation-authority
          rm .github/workflows/temp-pr89-sync-main.yml
          git add -A
          git commit --amend -m "Merge main into PR89 [pr89-main-synced]"
          git push origin HEAD:feat/collections-starter-kits-embeds
