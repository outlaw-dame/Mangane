name: Architecture inventory

on:
  pull_request:
    paths:
      - 'app/**'
      - 'config/**'
      - 'scripts/**'
      - '.github/workflows/architecture-inventory.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: architecture-inventory-reconcile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  inventory:
    name: Reconcile deterministic evidence
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Regenerate and self-restore
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          node scripts/generate-network-callsite-manifest.js
          node scripts/generate-telemetry-authority-inventory.js
          node scripts/generate-architecture-boundary-inventory.js
          git fetch origin main
          git show origin/main:.github/workflows/architecture-inventory.yml > .github/workflows/architecture-inventory.yml
          git add config/network-callsite-manifest.json \
            config/sentry-authority-inventory.json \
            config/architecture-boundary-inventory.json \
            .github/workflows/architecture-inventory.yml
          if git diff --cached --quiet; then
            echo 'Deterministic evidence already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Reconcile thread context authority manifests'
          git push origin "HEAD:${HEAD_BRANCH}"
