name: Temporary Phase 3E reconcile

on:
  push:
    branches:
      - phase-3e/framework7-icon-parity-and-closure

permissions:
  contents: write

concurrency:
  group: temporary-phase-3e-reconcile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
      - run: corepack enable
      - run: yarn install --immutable --mode=skip-build
      - name: Regenerate governed inventories
        run: |
          yarn generate:icons
          yarn generate:design-authority
          yarn generate:documentation-authority
          yarn generate:architecture-boundaries
      - name: Validate focused and repository gates
        run: |
          node --test scripts/__tests__/f7-shell-icon-authority.test.js
          yarn test:governance
          yarn typecheck
          yarn lint:js:baseline
          yarn lint:sass
          yarn test:browser-accessibility
          yarn check:build
          yarn build
      - name: Commit generated authorities and remove temporary workflow
        run: |
          rm -f .github/workflows/temporary-phase-3e-reconcile.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore(shell): reconcile Phase 3E authorities"
          git push
