name: Apply Mastodon quote support

on:
  push:
    branches:
      - feat/mastodon-quote-posts
    paths:
      - scripts/apply-mastodon-quote-support.js
      - .github/workflows/apply-mastodon-quote-support.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: feat/mastodon-quote-posts
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 18.20.8
      - run: node scripts/apply-mastodon-quote-support.js
      - name: Commit generated implementation
        run: |
          if git diff --quiet; then
            echo "No changes generated"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app docs config
          git commit -m "feat: support Mastodon quote posts"
          git push origin HEAD:feat/mastodon-quote-posts
