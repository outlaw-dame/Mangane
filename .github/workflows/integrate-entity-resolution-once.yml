name: Integrate entity resolution docs once

on:
  push:
    branches:
      - agent/document-entity-resolution

permissions:
  contents: write

concurrency:
  group: integrate-entity-resolution-once
  cancel-in-progress: true

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: agent/document-entity-resolution
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 18.20.8
      - name: Integrate canonical documents
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          function replaceRequired(text, from, to, label) {
            if (text.includes(to)) return text;
            if (!text.includes(from)) throw new Error(`Missing ${label}`);
            return text.replace(from, to);
          }

          const phasePath = 'docs/architecture/PHASE_8B_ENTITY_RESOLUTION_AND_CREATOR_ATTRIBUTION.md';

          const readmePath = 'docs/architecture/README.md';
          let readme = fs.readFileSync(readmePath, 'utf8');
          readme = replaceRequired(
            readme,
            '- [`PHASE_8B_CREATOR_ATTRIBUTION.md`](./PHASE_8B_CREATOR_ATTRIBUTION.md) defines native Mastodon `fediverse:creator`/`PreviewCard.authors` support and cross-platform creator bylines, including proof tiers, multiple authors, canonical-account deduplication, attribution-domain settings, safe optional metadata resolution, privacy, rollback, and adversarial gates.',
            '- [`PHASE_8B_ENTITY_RESOLUTION_AND_CREATOR_ATTRIBUTION.md`](./PHASE_8B_ENTITY_RESOLUTION_AND_CREATOR_ATTRIBUTION.md) defines Mangane’s shared canonical entity authority and its first creator-attribution consumer, including Wikidata/DBpedia enrichment, structured article/social metadata, semantic hashtags, entity-aware Custom Feeds, Search/Explore/Gist/recommendation/composer integration, proof tiers, deduplication, privacy, rollback, and adversarial gates.',
            'README Phase 8B bullet',
          );
          fs.writeFileSync(readmePath, readme);

          const roadmapPath = 'docs/architecture/IMPLEMENTATION_ROADMAP_V2.md';
          let roadmap = fs.readFileSync(roadmapPath, 'utf8');
          roadmap = replaceRequired(
            roadmap,
            '| Phase 8B — Creator Attribution | Queued | [`PHASE_8B_CREATOR_ATTRIBUTION.md`](./PHASE_8B_CREATOR_ATTRIBUTION.md) |',
            '| Phase 8B — Entity Resolution & Creator Attribution | Queued | [`PHASE_8B_ENTITY_RESOLUTION_AND_CREATOR_ATTRIBUTION.md`](./PHASE_8B_ENTITY_RESOLUTION_AND_CREATOR_ATTRIBUTION.md) |',
            'roadmap Phase 8B row',
          );
          const old8b = `## Phase 8B — Creator Attribution

Status: **Queued; see [\`PHASE_8B_CREATOR_ATTRIBUTION.md\`](./PHASE_8B_CREATOR_ATTRIBUTION.md).**

Goal: display accurate linked-work creator bylines and verified Fediverse creator accounts in link previews without confusing them with the author of the sharing status.

Deliverables:

- verified inventory of preview-card schemas, renderers, storage authorities, and supported backend fixtures;
- native Mastodon PreviewCard.authors and missing_attribution normalization;
- legacy author_name/author_url and platform-specific metadata fallback;
- multiple-author canonical model and deterministic account/resource deduplication;
- proof-tiered distinction between metadata-only, unverified claims, native server verification, and independently verified domain/account attribution;
- shared creator byline presentation across post cards, bookmarks, Search, Explore, conversations, and Gist evidence;
- capability-gated Mastodon attribution-domain profile settings;
- optional later direct-CORS or hardened trusted-resolver enrichment for servers without native support;
- URL, redirect, SSRF, WebFinger, actor, IDNA, privacy, cache, migration, rollback, accessibility, and performance gates.

Exit criteria:

- status author, linked-work creator, and publication remain distinct;
- one resource/creator identity does not create duplicate bylines or account records;
- native and legacy responses degrade without breaking link previews;
- an arbitrary publication cannot attribute itself to an unrelated Fediverse account;
- external resolution is absent or passes all hardened resolver gates;
- account isolation, moderation, moves, suspension, offline, migration, rollback, accessibility, and performance tests pass.
`;
          const new8b = `## Phase 8B — Entity Resolution & Creator Attribution

Status: **Queued; see [\`PHASE_8B_ENTITY_RESOLUTION_AND_CREATOR_ATTRIBUTION.md\`](./PHASE_8B_ENTITY_RESOLUTION_AND_CREATOR_ATTRIBUTION.md).**

Goal: establish one local-first canonical entity authority and use it for creator attribution, semantic hashtags, entity-aware Custom Feeds, Search, Explore, Gist, recommendations, composer context, and future semantic navigation without duplicate entity stores.

Deliverables:

- canonical entities, aliases, relationships, mentions, evidence, provider references, resolutions, merges/splits, tombstones, migrations, purge, and repair;
- provider-neutral resolver and confidence/abstention contracts;
- bounded Wikidata and DBpedia matching/enrichment with provenance, attribution, caching, retry, circuit breakers, privacy, and degraded modes;
- native Mastodon PreviewCard.authors, legacy fallback, multiple creators, missing_attribution, and capability-gated attribution-domain settings;
- cross-platform extraction of fediverse:creator, Schema.org JSON-LD, sameAs, rel=author, Open Graph, oEmbed, microformats, Dublin Core, conventional author metadata, and low-confidence visible bylines;
- proof-tiered separation of creator discovery, social-profile discovery, Fediverse account resolution, and publication authorization;
- literal-plus-semantic hashtag bindings and ambiguity handling;
- bounded entity rules for Custom Feeds with exact, related, include, exclude, boost, require, preview, and lexical-fallback behavior;
- shared integration with Search, Explore, Gist, recommendations, topic/entity pages, composer context, and the interpolator;
- account isolation, moderation, URL/SSRF/DNS, Unicode/IDNA, cache-poisoning, migration, rollback, accessibility, performance, and evaluation gates.

Exit criteria:

- every consumer uses one canonical entity authority and no creator- or feature-specific duplicate graph remains;
- ambiguous entities and hashtags abstain or remain literal rather than binding silently;
- Wikidata/DBpedia outage never disables local search, previews, hashtags, or Custom Feeds;
- status author, creator, publication, social identity, and verification proof remain distinct;
- entity-aware feeds are bounded, deterministic, explainable, revisioned, and policy-safe;
- merge/split, aliases, account moves, provider redirects, offline, corruption, purge, rollback, security, accessibility, and performance tests pass.
`;
          roadmap = replaceRequired(roadmap, old8b, new8b, 'roadmap Phase 8B section');

          const old15 = `## Phase 15 — Entity resolution and knowledge enrichment

Goal: add canonical entity understanding without coupling to external services.

Deliverables:

- local entity schema and alias index;
- mention detection and candidate generation;
- contextual disambiguation;
- Wikidata and DBpedia enrichment adapters;
- provenance, license/attribution, freshness, caching, and retry policy;
- ambiguous/unresolved states;
- entity facets and cards;
- privacy-minimized requests;
- evaluation for common ambiguous names.

Exit criteria:

- entity matches improve relevant queries;
- unavailable external enrichment leaves local search functional;
- incorrect links are correctable and do not become permanent facts.
`;
          const new15 = `## Phase 15 — Entity retrieval, graph expansion, and search integration

Goal: mature and evaluate the Phase 8B canonical entity authority as a first-class retrieval channel without creating a second entity schema, provider layer, cache, or confidence engine.

Dependencies:

- Phase 8B canonical entity contracts, local repository, resolver/evidence model, Wikidata/DBpedia adapters, semantic hashtag bindings, and migration rules;
- Phases 12–14 lexical, vector, query-planning, and fusion foundations.

Deliverables:

- entity retriever over the Phase 8B canonical repository and alias index;
- query mention detection and contextual candidate generation using the shared resolver;
- bounded graph expansion by explicitly allowed relationship predicates and depth;
- entity facets, cards, topic/entity navigation, and explanation evidence;
- multilingual aliases, redirects, freshness, and provider-outage behavior inherited from Phase 8B;
- calibrated fusion of entity candidates with lexical, vector, topic, and conversation retrieval;
- privacy-minimized evaluation for common names, ambiguous hashtags, events, organizations, creators, and multilingual queries.

Exit criteria:

- entity retrieval improves agreed relevance metrics without harming exact identifiers or literal hashtags;
- all records and evidence resolve through the Phase 8B authority rather than duplicate Phase 15 stores;
- unavailable external enrichment leaves local entity and lexical search functional;
- incorrect links remain correctable, explainable, reversible, and non-permanent.
`;
          roadmap = replaceRequired(roadmap, old15, new15, 'roadmap Phase 15 section');
          fs.writeFileSync(roadmapPath, roadmap);

          const searchPath = 'docs/architecture/SEARCH_AND_INTELLIGENCE.md';
          let search = fs.readFileSync(searchPath, 'utf8');
          const oldEntities = `## 8. Entities, topics, Gist, and Explore

Entity processing follows mention detection, candidate generation, contextual resolution, a canonical local entity, and optional Wikidata/DBpedia enrichment. External knowledge bases enrich internal records but do not define them. Cached enrichment retains provenance, retrieval time, and attribution metadata.

Topic assignments are local, versioned derived data with confidence values. They are not permanent facts about users or authors.
`;
          const newEntities = `## 8. Entities, topics, Gist, and Explore

Phase 8B defines the single canonical entity authority used by Search and every other intelligent consumer. Entity processing follows mention or hashtag extraction, candidate generation, contextual resolution, confidence plus margin gates, explicit ambiguity/abstention, canonical local identity, and optional Wikidata/DBpedia enrichment. External knowledge graphs provide aliases, multilingual labels, types, redirects, official links, and selected relationships; they enrich internal records but do not define ownership, authorship, authorization, or truth. Cached enrichment retains provider, evidence, retrieval time, freshness, license/attribution metadata, and independently disableable provider state.

Literal hashtags remain independently searchable social tokens. A separate `HashtagEntityBinding` may resolve context-specific meanings, equivalent event tags, aliases, and translations for semantic search, Custom Feeds, recommendations, topic pages, and Gist grouping. Ambiguous tags remain literal or unresolved rather than receiving a universal meaning.

Entity retrieval, graph expansion, and fusion in Phase 15 must reuse Phase 8B schemas, repositories, aliases, resolver evidence, Wikidata/DBpedia clients, caches, confidence policy, merge/split history, and privacy boundaries. Phase 15 may add retrieval indexes and evaluation, but it may not establish a second entity graph.

Topic assignments are local, versioned derived data with confidence values. They are not permanent facts about users or authors. Topic/entity relationships must preserve provenance and cannot bypass canonical-record access checks.
`;
          search = replaceRequired(search, oldEntities, newEntities, 'search entity section');
          search = search.replace('Last updated: 2026-07-23', 'Last updated: 2026-07-29');
          fs.writeFileSync(searchPath, search);

          const feedsPath = 'docs/architecture/PHASE_23A_CUSTOM_FEEDS.md';
          let feeds = fs.readFileSync(feedsPath, 'utf8');
          feeds = feeds.replace('Last updated: 2026-07-28', 'Last updated: 2026-07-29');
          feeds = replaceRequired(
            feeds,
            '- Phase 8 the shared renderer, timeline state, and pinned-feed shell;\n- Phases 12–17 lexical, semantic, topic, fusion, and explanation contracts;',
            '- Phase 8 the shared renderer, timeline state, and pinned-feed shell;\n- Phase 8B the canonical entity authority, semantic hashtag bindings, Wikidata/DBpedia enrichment, confidence/ambiguity policy, and entity feed-rule contract;\n- Phases 12–17 lexical, semantic, entity-retrieval, topic, fusion, and explanation contracts;',
            'Custom Feed dependencies',
          );
          const entityFeeds = `## Entity-aware hashtags, topics, and feed rules

Custom Feeds must preserve literal hashtag and keyword rules while optionally referencing Phase 8B canonical entities. A feed definition may use exact entities, selected first-degree related entities, and versioned include, exclude, boost, or require modes. It must store stable `CanonicalEntityId` references rather than Wikidata Q IDs, DBpedia URIs, labels, or model-generated names as its primary identity.

A rule such as Apple Inc. may match high-confidence entity mentions, context-resolved hashtags, linked resources, official accounts, products, or events only when the feed revision explicitly permits those relationship predicates. Entity graph traversal is never implicit or unbounded: depth is initially zero or one, allowed predicates are explicit, confidence thresholds and candidate budgets are versioned, and fan-out is capped.

Creator controls must distinguish:

- literal hashtag or keyword matching;
- exact canonical entity matching;
- selected related entities;
- whether ambiguous items are excluded, included, or shown only in private creator preview;
- behavior when Wikidata, DBpedia, local entity indexes, or semantic models are unavailable.

Degraded behavior returns to literal hashtag, keyword, account, and lexical rules. Entity failure never empties an otherwise valid feed, bypasses subscriber policy, or changes the follow graph. Private feed definitions, examples, exclusions, negative feedback, and subscriber context must not be sent to Wikidata, DBpedia, or another public resolver.

Entity-aware matching decisions retain evidence and policy versions so creator preview and “Why included” explanations reflect the actual rule. Personal subscriber affinity may rerank eligible items only where separately permitted; it cannot change the creator's canonical entity rule or be represented as objective entity truth.

`;
          if (!feeds.includes('## Entity-aware hashtags, topics, and feed rules')) {
            feeds = feeds.replace('## Semantic and privacy contract\n', entityFeeds + '## Semantic and privacy contract\n');
          }
          const slice = `### 23A.6 — Entity-aware feed precision

- Phase 8B canonical entity references and semantic hashtag bindings;
- exact-entity and selected-related-entity rules with bounded predicates/depth;
- include, exclude, boost, and require modes;
- ambiguity handling and private creator preview;
- literal/lexical fallback during provider, model, index, or cache failure;
- Wikidata/DBpedia privacy, request-volume, stale-data, disagreement, and outage fixtures;
- explanation, relevance, over-expansion, deduplication, migration, and adversarial tests.

`;
          if (!feeds.includes('### 23A.6 — Entity-aware feed precision')) {
            feeds = feeds.replace('## Explicit deferrals\n', slice + '## Explicit deferrals\n');
          }
          feeds = feeds.replace(
            '6. hashtags, keywords, topics, and exclusions are predictable and creator\n   preview is private;',
            '6. literal hashtags, semantic hashtag bindings, keywords, topics, canonical entities, related-entity rules, and exclusions are predictable, bounded, explainable, and creator preview is private;',
          );
          fs.writeFileSync(feedsPath, feeds);

          const adrPath = 'docs/architecture/ARCHITECTURAL_DECISIONS.md';
          let adr = fs.readFileSync(adrPath, 'utf8');
          const start = adr.indexOf('## ADR-028 —');
          const end = adr.indexOf('## ADR template', start);
          if (start < 0 || end < 0) throw new Error('Missing ADR-028 block');
          const adr028 = `## ADR-028 — Entity Resolution & Creator Attribution share one canonical entity authority

Status: Accepted

Date: 2026-07-29

Decision: Replace the creator-only Phase 8B plan with an application-wide Entity Resolution & Creator Attribution phase. Mangane owns canonical entity IDs, evidence, aliases, relationships, mentions, resolutions, merge/split history, and account-safe derived bindings. Wikidata and DBpedia are optional enrichment/candidate providers, not ownership or truth authorities. Creator attribution, semantic hashtags, Custom Feeds, Search, Explore, Gist, recommendations, topic pages, and composer intelligence must reuse this authority rather than create separate graphs.

Context: Mastodon 4.3 introduced fediverse:creator and PreviewCard.authors, while other platforms may expose only conventional article metadata. Creator matching, hashtag disambiguation, semantic feed rules, search entities, and AI grounding all need the same identity, provenance, confidence, ambiguity, cache, and merge semantics. The canonical roadmap already contained a later entity phase, so responsibilities must be partitioned rather than duplicated: Phase 8B establishes the authority and consumers; Phase 15 matures entity retrieval and fusion over it.

Alternatives considered: keep creator attribution isolated; defer all entity work to Phase 15; use Wikidata Q IDs as primary keys; maintain separate hashtag/topic/feed entity stores; trust name-only or sameAs matches; query public providers with private context.

Rationale: One local canonical authority reduces duplicate state, improves creator and hashtag accuracy, makes Custom Feeds more intelligent, supports offline/degraded behavior, and permits external providers to change or disagree without changing Mangane identity.

Consequences and tradeoffs: Phase 8B becomes broader and must ship in slices. It adds schema/migration, resolver policy, provider attribution/licensing, confidence and abstention, graph bounds, merge/split repair, and more extensive evaluation. Phase 15 is narrowed to retrieval, graph expansion, fusion, facets, and evaluation over Phase 8B contracts.

Security/privacy impact: Public providers receive only minimized public lookup terms and never private drafts, private posts, hidden feed definitions, reading history, access tokens, or subscriber context. Resolver output cannot authorize access or ownership. External URLs, redirects, DNS, bodies, graph depth, candidates, queues, retries, and caches are bounded and fail closed.

Migration/rollback: The superseded creator-only document and any prototype creator store are replaced by canonical entities plus creator relationships. Provider and consumer flags can roll back independently while ordinary previews, literal hashtags, lexical feeds, statuses, accounts, and local search continue.

`;
          adr = adr.slice(0, start) + adr028 + adr.slice(end);
          fs.writeFileSync(adrPath, adr);
          NODE
      - run: node scripts/generate-documentation-authority-registry.js
      - run: node scripts/check-documentation-authority.js
      - run: node --test scripts/__tests__/check-documentation-authority.test.js
      - name: Commit integrated documentation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/architecture/README.md docs/architecture/IMPLEMENTATION_ROADMAP_V2.md docs/architecture/SEARCH_AND_INTELLIGENCE.md docs/architecture/PHASE_23A_CUSTOM_FEEDS.md docs/architecture/ARCHITECTURAL_DECISIONS.md config/documentation-authority-registry.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Integrate entity resolution architecture'
          git push origin HEAD:agent/document-entity-resolution

# Trigger integration after workflow registration.
