name: PWA installability

on:
  pull_request:
    paths:
      - 'app/index.ejs'
      - 'app/manifest.json'
      - 'app/pwa-icons/**'
      - 'app/soapbox/features/pwa-install/**'
      - 'app/soapbox/main.tsx'
      - 'app/soapbox/service_worker/**'
      - 'app/styles/components/pwa-install.scss'
      - 'config/service-worker-cache-authority-inventory.json'
      - 'config/share-target-authority-inventory.json'
      - 'docs/architecture/PHASE_4B_PWA_INSTALLABILITY_CLOSURE.md'
      - 'e2e/pwa/**'
      - 'playwright.pwa.config.ts'
      - 'scripts/check-pwa-installability.js'
      - 'scripts/pwa-installability-lib.js'
      - 'scripts/serve-pwa-fixture.js'
      - 'scripts/__tests__/check-pwa-installability.test.js'
      - 'webpack/production.js'
      - 'webpack/shared.js'
      - 'package.json'
      - '.github/workflows/pwa-installability.yml'
  push:
    branches: [main]
    paths:
      - 'app/index.ejs'
      - 'app/manifest.json'
      - 'app/pwa-icons/**'
      - 'app/soapbox/features/pwa-install/**'
      - 'app/soapbox/main.tsx'
      - 'app/soapbox/service_worker/**'
      - 'app/styles/components/pwa-install.scss'
      - 'config/service-worker-cache-authority-inventory.json'
      - 'config/share-target-authority-inventory.json'
      - 'docs/architecture/PHASE_4B_PWA_INSTALLABILITY_CLOSURE.md'
      - 'e2e/pwa/**'
      - 'playwright.pwa.config.ts'
      - 'scripts/check-pwa-installability.js'
      - 'scripts/pwa-installability-lib.js'
      - 'scripts/serve-pwa-fixture.js'
      - 'scripts/__tests__/check-pwa-installability.test.js'
      - 'webpack/production.js'
      - 'webpack/shared.js'
      - 'package.json'
      - '.github/workflows/pwa-installability.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pwa-installability-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Production PWA / release-maintainers
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      NODE_ENV: production
      FE_SUBDIRECTORY: Mangane
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '18.20.8'
      - run: corepack enable
      - run: yarn install --immutable --mode=skip-build
      - run: yarn check:pwa-installability
      - run: yarn test:pwa-installability
      - run: yarn prepare:twemoji
      - run: yarn build
      - run: PWA_BUILD_OUTPUT_ROOT=static/Mangane PWA_BASE_PATH=/Mangane yarn check:pwa-installability
      - run: yarn exec playwright install --with-deps chromium
      - run: yarn test:pwa-browser
