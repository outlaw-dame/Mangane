name: Temporary PR77 review fixes

on:
  push:
    branches:
      - docs/phase-10-threaded-post-composer

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[pr77-review-fixed]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/phase-10-threaded-post-composer
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: yarn install --immutable --mode=skip-build
      - name: Apply review fixes
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path('docs/architecture/PHASE_10_THREADED_POST_COMPOSER_AND_RELIABLE_PUBLISHING.md')
          text = path.read_text()

          old_model = """  mode: 'new-sequence' | 'continue-published-sequence';
  continuationParent?: PublishedStatusRef;
  segmentOrder: readonly string[];"""
          new_model = """  mode: 'new-sequence' | 'continue-published-sequence';
  initialReplyTarget?: PublishedStatusRef;
  continuationParent?: PublishedStatusRef;
  segmentOrder: readonly string[];"""
          if old_model not in text:
              raise SystemExit('draft model anchor not found')
          text = text.replace(old_model, new_model, 1)

          old_sep = """- local draft sequence identity;
- local segment identity;
- published canonical status identity;"""
          new_sep = """- local draft sequence identity;
- local segment identity;
- an optional `initialReplyTarget` used only when segment 1 of a new sequence replies to an existing external status;
- an optional `continuationParent` used only when appending to an already-published authored sequence;
- published canonical status identity;"""
          if old_sep not in text:
              raise SystemExit('identity separation anchor not found')
          text = text.replace(old_sep, new_sep, 1)

          publication_anchor = """The next command is not released merely because the prior HTTP request returned. It requires a validated success response or reconciliation proving the status exists with the expected author, content fingerprint or client token, and parent relationship.
"""
          publication_insert = publication_anchor + """
For a new sequence started as a reply, the frozen publication run must copy `initialReplyTarget` from the confirmed draft revision and publish segment 1 against that exact canonical target. For a root sequence it must be absent. For `continue-published-sequence`, `continuationParent` is the parent of segment 1. These fields are mutually exclusive, remain account-scoped, and may not be reconstructed from route state after the run is frozen. Later segments always reply to the immediately preceding confirmed segment.
"""
          if publication_anchor not in text:
              raise SystemExit('publication anchor not found')
          text = text.replace(publication_anchor, publication_insert, 1)

          reconcile_anchor = """- server-side scheduled-status identity where applicable.
"""
          reconcile_insert = reconcile_anchor + """
A reconciliation attempt may advance the run only when it yields exactly one provable candidate after all applicable authority checks. Zero candidates remain unresolved. Multiple candidates are ambiguous even when their visible content is identical; the run transitions to `needs-user-action`, does not choose a candidate, does not release dependent segments, and does not automatically retry the original non-idempotent publication. The recovery UI must explain the ambiguity without exposing private candidate data and offer bounded user-directed verification or cancellation.
"""
          if reconcile_anchor not in text:
              raise SystemExit('reconciliation anchor not found')
          text = text.replace(reconcile_anchor, reconcile_insert, 1)

          path.write_text(text)
          PY
      - name: Regenerate documentation authority
        run: yarn generate:documentation-authority
      - name: Remove temporary workflow and commit
        run: |
          rm .github/workflows/temp-pr77-review-fixes.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "docs: address PR77 review comments [pr77-review-fixed]"
          git push origin HEAD:docs/phase-10-threaded-post-composer
