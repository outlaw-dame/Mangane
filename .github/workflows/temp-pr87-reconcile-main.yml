name: Temporary PR87 authority regeneration

on:
  push:
    branches:
      - feat/featured-hashtags

permissions:
  contents: write

jobs:
  regenerate:
    if: ${{ !contains(github.event.head_commit.message, '[pr87-authority-generated]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/featured-hashtags
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - run: corepack enable
      - run: yarn install --immutable
      - name: Regenerate affected authority inventories
        run: |
          yarn generate:html-safety
          yarn generate:telemetry
          yarn generate:design-authority
          yarn generate:architecture-boundaries
          node scripts/generate-component-ownership-manifest.js
          yarn generate:documentation-authority
      - run: rm .github/workflows/temp-pr87-reconcile-main.yml
      - name: Commit generated inventories
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "chore: regenerate PR87 authorities [pr87-authority-generated]"
          git push origin HEAD:feat/featured-hashtags
