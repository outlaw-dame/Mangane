name: Temporary PR87 main reconciliation

on:
  push:
    branches:
      - feat/featured-hashtags

permissions:
  contents: write

jobs:
  reconcile:
    if: ${{ !contains(github.event.head_commit.message, '[pr87-main-reconciled]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/featured-hashtags
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - run: corepack enable
      - run: git fetch origin main
      - run: git merge --no-edit origin/main
      - run: yarn install --immutable --mode=skip-build
      - run: |
          yarn generate:html-safety
          yarn generate:telemetry
          yarn generate:design-authority
          yarn generate:architecture-boundaries
          node scripts/generate-component-ownership-manifest.js
          yarn generate:documentation-authority
      - run: rm .github/workflows/temp-pr87-reconcile-main.yml
      - name: Commit reconciliation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "chore: reconcile featured tags with main [pr87-main-reconciled]" || true
          git push origin HEAD:feat/featured-hashtags
