name: Temporary PR88 authority regeneration

on:
  push:
    branches:
      - docs/profile-walls-adaptive-thread-timelines

permissions:
  contents: write

jobs:
  regenerate:
    if: ${{ !contains(github.event.head_commit.message, '[pr88-authority-generated]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/profile-walls-adaptive-thread-timelines
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn generate:documentation-authority
      - run: rm .github/workflows/temp-pr88-authority.yml
      - name: Commit generated registry
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "chore: regenerate PR88 authority [pr88-authority-generated]"
          git push origin HEAD:docs/profile-walls-adaptive-thread-timelines
