name: Documentation authority

on:
  pull_request:
    paths:
      - '**.md'
      - 'config/documentation-authority-registry.json'
      - 'config/historical-requirement-traceability.json'
      - 'scripts/documentation-authority-lib.js'
      - 'scripts/generate-documentation-authority-registry.js'
      - 'scripts/check-documentation-authority.js'
      - 'scripts/__tests__/check-documentation-authority.test.js'
      - '.github/workflows/documentation-authority.yml'
  push:
    branches:
      - main
      - agent/document-entity-resolution
    paths:
      - '**.md'
      - 'config/documentation-authority-registry.json'
      - '.github/workflows/documentation-authority.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: documentation-authority-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regenerate-final-registry:
    if: github.event_name == 'push' && github.ref == 'refs/heads/agent/document-entity-resolution' && github.actor != 'github-actions[bot]'
    name: Regenerate final documentation registry
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: agent/document-entity-resolution
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '18.20.8'
      - run: node scripts/generate-documentation-authority-registry.js
      - run: node scripts/check-documentation-authority.js
      - run: node --test scripts/__tests__/check-documentation-authority.test.js
      - name: Restore workflow and commit generated registry
        run: |
          git show origin/main:.github/workflows/documentation-authority.yml > .github/workflows/documentation-authority.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add config/documentation-authority-registry.json .github/workflows/documentation-authority.yml
          git commit -m "Regenerate documentation authority registry after cleanup"
          git push origin HEAD:agent/document-entity-resolution

  verify:
    if: github.event_name != 'push' || github.ref == 'refs/heads/main'
    name: Documentation reconciliation / architecture-maintainers
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '18.20.8'
      - run: node scripts/check-documentation-authority.js
      - run: node --test scripts/__tests__/check-documentation-authority.test.js
