name: Documentation authority

on:
  pull_request:
    paths:
      - '**.md'
      - 'config/documentation-authority-registry.json'
      - 'config/historical-requirement-traceability.json'
      - 'scripts/documentation-authority-lib.js'
      - 'scripts/generate-documentation-authority-registry.js'
      - 'scripts/check-documentation-authority.js'
      - 'scripts/__tests__/check-documentation-authority.test.js'
      - '.github/workflows/documentation-authority.yml'
  push:
    branches: [main]
    paths:
      - '**.md'
      - 'config/documentation-authority-registry.json'
      - 'config/historical-requirement-traceability.json'
      - 'scripts/documentation-authority-lib.js'
      - 'scripts/generate-documentation-authority-registry.js'
      - 'scripts/check-documentation-authority.js'
      - 'scripts/__tests__/check-documentation-authority.test.js'
      - '.github/workflows/documentation-authority.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: documentation-authority-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reconcile-pr77:
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.number == 77 && !contains(github.event.pull_request.head.sha, '0000000') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/phase-10-threaded-post-composer
          fetch-depth: 0
          token: ${{ github.token }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: yarn install --immutable --mode=skip-build
      - name: Apply review fixes
        run: |
          if git log -1 --pretty=%B | grep -q '\[pr77-review-fixed\]'; then exit 0; fi
          python <<'PY'
          from pathlib import Path

          path = Path('docs/architecture/PHASE_10_THREADED_POST_COMPOSER_AND_RELIABLE_PUBLISHING.md')
          text = path.read_text()

          replacements = [
              ("  mode: 'new-sequence' | 'continue-published-sequence';\n  continuationParent?: PublishedStatusRef;\n  segmentOrder: readonly string[];",
               "  mode: 'new-sequence' | 'continue-published-sequence';\n  initialReplyTarget?: PublishedStatusRef;\n  continuationParent?: PublishedStatusRef;\n  segmentOrder: readonly string[];"),
              ("- local draft sequence identity;\n- local segment identity;\n- published canonical status identity;",
               "- local draft sequence identity;\n- local segment identity;\n- an optional `initialReplyTarget` used only when segment 1 of a new sequence replies to an existing external status;\n- an optional `continuationParent` used only when appending to an already-published authored sequence;\n- published canonical status identity;"),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'anchor not found: {old[:60]}')
              text = text.replace(old, new, 1)

          anchor = "The next command is not released merely because the prior HTTP request returned. It requires a validated success response or reconciliation proving the status exists with the expected author, content fingerprint or client token, and parent relationship.\n"
          addition = anchor + "\nFor a new sequence started as a reply, the frozen publication run must copy `initialReplyTarget` from the confirmed draft revision and publish segment 1 against that exact canonical target. For a root sequence it must be absent. For `continue-published-sequence`, `continuationParent` is the parent of segment 1. These fields are mutually exclusive, remain account-scoped, and may not be reconstructed from route state after the run is frozen. Later segments always reply to the immediately preceding confirmed segment.\n"
          if anchor not in text:
              raise SystemExit('publication anchor not found')
          text = text.replace(anchor, addition, 1)

          anchor = "- server-side scheduled-status identity where applicable.\n"
          addition = anchor + "\nA reconciliation attempt may advance the run only when it yields exactly one provable candidate after all applicable authority checks. Zero candidates remain unresolved. Multiple candidates are ambiguous even when their visible content is identical; the run transitions to `needs-user-action`, does not choose a candidate, does not release dependent segments, and does not automatically retry the original non-idempotent publication. The recovery UI must explain the ambiguity without exposing private candidate data and offer bounded user-directed verification or cancellation.\n"
          if anchor not in text:
              raise SystemExit('reconciliation anchor not found')
          text = text.replace(anchor, addition, 1)
          path.write_text(text)
          PY
          yarn generate:documentation-authority
          git fetch origin main
          git checkout origin/main -- .github/workflows/documentation-authority.yml
          rm -f .github/workflows/temp-pr77-review-fixes.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "docs: address PR77 review comments [pr77-review-fixed]"
          git push origin HEAD:docs/phase-10-threaded-post-composer

  verify:
    name: Documentation reconciliation / architecture-maintainers
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '18.20.8'
      - run: node scripts/check-documentation-authority.js
      - run: node --test scripts/__tests__/check-documentation-authority.test.js
