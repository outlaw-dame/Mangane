name: Documentation authority

on:
  pull_request:
    paths:
      - '**.md'
      - 'config/documentation-authority-registry.json'
      - '.github/workflows/documentation-authority.yml'

permissions:
  contents: write

concurrency:
  group: documentation-authority-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reconcile:
    name: Reconcile documentation authority
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out PR branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
          fetch-depth: 0
      - name: Restore workflow, generate registry, and commit
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout origin/main -- .github/workflows/documentation-authority.yml
          node scripts/generate-documentation-authority-registry.js
          node scripts/check-documentation-authority.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/documentation-authority.yml config/documentation-authority-registry.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Reconcile documentation authority registry'
          git push origin HEAD:${{ github.head_ref }}