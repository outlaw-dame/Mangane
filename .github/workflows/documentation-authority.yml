name: Documentation authority

on:
  pull_request:
    paths:
      - '**.md'
      - 'config/documentation-authority-registry.json'
      - 'config/historical-requirement-traceability.json'
      - 'scripts/documentation-authority-lib.js'
      - 'scripts/generate-documentation-authority-registry.js'
      - 'scripts/check-documentation-authority.js'
      - 'scripts/__tests__/check-documentation-authority.test.js'
      - '.github/workflows/documentation-authority.yml'
  push:
    branches: [main]
    paths:
      - '**.md'
      - 'config/documentation-authority-registry.json'
      - 'config/historical-requirement-traceability.json'
      - 'scripts/documentation-authority-lib.js'
      - 'scripts/generate-documentation-authority-registry.js'
      - 'scripts/check-documentation-authority.js'
      - 'scripts/__tests__/check-documentation-authority.test.js'
      - '.github/workflows/documentation-authority.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: documentation-authority-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Documentation reconciliation / architecture-maintainers
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref }}
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '18.20.8'
      - name: Regenerate documentation authority registry
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'github-actions[bot]'
        run: |
          node scripts/generate-documentation-authority-registry.js
          if ! git diff --quiet -- config/documentation-authority-registry.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add config/documentation-authority-registry.json
            git commit -m 'Regenerate documentation authority registry'
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
      - run: node scripts/check-documentation-authority.js
      - run: node --test scripts/__tests__/check-documentation-authority.test.js
