name: Documentation authority

on:
  pull_request:
    paths:
      - '**.md'
      - 'config/documentation-authority-registry.json'
      - '.github/workflows/documentation-authority.yml'
  push:
    branches:
      - agent/document-misskey-markdown-mfm

permissions:
  contents: write

concurrency:
  group: documentation-authority-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reconcile:
    name: Reconcile Misskey phase review
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out PR branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true
          fetch-depth: 0
      - name: Restore workflow, update phase, regenerate registry, and commit
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout origin/main -- .github/workflows/documentation-authority.yml
          mv docs/architecture/PHASE_8C_MISSKEY_MARKDOWN_MFM_COMPATIBILITY.md docs/architecture/PHASE_8D_MISSKEY_MARKDOWN_MFM_COMPATIBILITY.md
          python3 <<'PY'
          from pathlib import Path

          phase = Path('docs/architecture/PHASE_8D_MISSKEY_MARKDOWN_MFM_COMPATIBILITY.md')
          text = phase.read_text()
          text = text.replace('Phase 8C', 'Phase 8D')
          old = '''Mangane must classify content using authoritative evidence, in descending order of preference:

          1. explicit source/content-type metadata returned by the authenticated server API;
          2. an instance capability advertised by the connected server;
          3. a documented endpoint contract whose response shape identifies the source format;
          4. sanitized server-rendered HTML when no source format is available;
          5. plain-text fallback.

          Server software names may be used as advisory evidence for compatibility diagnostics, but must not be the sole runtime authority when capability or payload evidence is available.'''
          new = '''Mangane must classify each individual payload using evidence tied to that payload, in descending order of preference:

          1. explicit source/content-type metadata attached to the specific payload field returned by the authenticated server API;
          2. a documented endpoint contract that defines the format of that specific response field;
          3. sanitized server-rendered HTML when no authoritative source field is available;
          4. plain-text fallback.

          Instance-wide capabilities may gate parser availability, authoring controls, preview, and submission behavior, but they must never classify a particular timeline payload as Markdown or MFM. A server can support a format while returning an individual status only as rendered HTML or plain text. Server software names remain advisory diagnostics only and must not select a parser.'''
          if old not in text:
              raise SystemExit('Expected capability classification block not found')
          phase.write_text(text.replace(old, new))

          roadmap = Path('docs/architecture/IMPLEMENTATION_ROADMAP_V2.md')
          road = roadmap.read_text()
          road = road.replace('Last updated: 2026-07-29', 'Last updated: 2026-07-30')
          row = '| Phase 8C — Shared Activity Aggregation and Shared Shelf | Queued | [`PHASE_8C_SHARED_ACTIVITY_AGGREGATION_AND_SHELF.md`](./PHASE_8C_SHARED_ACTIVITY_AGGREGATION_AND_SHELF.md) |'
          addition = row + '\n| Phase 8D — Misskey post, Markdown, and MFM compatibility | Queued; required before the next implementation phase | [`PHASE_8D_MISSKEY_MARKDOWN_MFM_COMPATIBILITY.md`](./PHASE_8D_MISSKEY_MARKDOWN_MFM_COMPATIBILITY.md) |'
          if row not in road:
              raise SystemExit('Expected Phase 8C roadmap row not found')
          road = road.replace(row, addition, 1)
          section = '''

          ---

          ## Phase 8D — Misskey post, Markdown, and MFM compatibility

          Status: **Queued and required before another implementation phase proceeds; see [`PHASE_8D_MISSKEY_MARKDOWN_MFM_COMPATIBILITY.md`](./PHASE_8D_MISSKEY_MARKDOWN_MFM_COMPATIBILITY.md).**

          Goal: establish tested, capability-aware, and safely degraded support for direct and federated Misskey-origin posts, standard Markdown, and Misskey Flavored Markdown without bypassing Mangane's normalization, sanitization, URL, accessibility, reduced-motion, or build authorities.

          Deliverables:

          - versioned direct and federated Misskey fixture suites with provenance and tested-version records;
          - per-payload content-format classification based on explicit field metadata or documented endpoint contracts;
          - standard Markdown and MFM support/degradation matrices;
          - bounded deterministic parsers and inert readable fallbacks;
          - composer, preview, edit, and redraft source preservation when the connected server proves support;
          - fuzz, adversarial, accessibility, reduced-motion, normalization, rendering, and end-to-end tests;
          - a dedicated Misskey compatibility CI contract that preserves all existing authority gates.

          Exit criteria:

          - representative Misskey posts survive fetch, normalization, storage, and rendering without avoidable semantic loss;
          - instance capabilities gate availability and authoring but never misclassify individual payload fields;
          - unsupported or unsafe MFM remains readable and inert;
          - all new and existing CI checks pass on the final head.
          '''
          marker = '\n## Phase 9 — Search'
          if marker in road:
              road = road.replace(marker, section + marker, 1)
          else:
              road = road.rstrip() + section + '\n'
          roadmap.write_text(road)
          PY
          node scripts/generate-documentation-authority-registry.js
          node scripts/check-documentation-authority.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A .github/workflows/documentation-authority.yml docs/architecture config/documentation-authority-registry.json
          git commit -m 'Resolve Misskey phase roadmap and parser authority'
          git push origin HEAD:${{ github.ref_name }}
