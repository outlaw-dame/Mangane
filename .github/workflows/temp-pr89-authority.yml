name: Temporary PR89 authority regeneration

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/collections-starter-kits-embeds
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: yarn install --immutable
      - name: Regenerate affected authorities
        run: |
          yarn generate:network-callsites
          yarn generate:html-safety
          yarn generate:telemetry
          yarn generate:design-authority
          yarn generate:architecture-boundaries
          yarn generate:documentation-authority
      - run: rm .github/workflows/temp-pr89-authority.yml
      - name: Commit generated inventories
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "chore: regenerate PR89 authorities [pr89-authority-generated]"
          git push origin HEAD:feat/collections-starter-kits-embeds
