name: Temporary PR89 main reconciliation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/collections-starter-kits-embeds
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: git fetch origin main
      - run: git merge --no-edit -X theirs origin/main
      - run: yarn install --immutable
      - name: Regenerate affected authorities
        run: |
          yarn generate:network-callsites
          yarn generate:html-safety
          yarn generate:telemetry
          yarn generate:design-authority
          yarn generate:architecture-boundaries
          yarn generate:documentation-authority
      - run: rm .github/workflows/temp-pr89-reconcile-main.yml
      - name: Commit reconciliation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "chore: reconcile PR89 with main [pr89-main-reconciled]" || true
          git push origin HEAD:feat/collections-starter-kits-embeds
