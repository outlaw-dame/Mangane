name: Temporary post-PR77 final registry regeneration

on:
  push:
    branches:
      - fix/post-pr77-ci

permissions:
  contents: write

jobs:
  regenerate:
    if: ${{ !contains(github.event.head_commit.message, '[post-pr77-final-regenerated]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/post-pr77-ci
      - uses: actions/setup-node@v4
        with:
          node-version: '18.20.8'
      - run: node scripts/generate-documentation-authority-registry.js
      - run: rm -f .github/workflows/temp-post-pr77-final-regenerate.yml
      - name: Commit final registry
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'chore: regenerate final post-PR77 registry [post-pr77-final-regenerated]'
          git push origin HEAD:fix/post-pr77-ci
