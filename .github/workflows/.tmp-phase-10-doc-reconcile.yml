name: Temporary Phase 10 documentation reconciliation

on:
  push:
    branches:
      - docs/phase-10-threaded-post-composer

permissions:
  contents: write

concurrency:
  group: temporary-phase-10-doc-reconcile
  cancel-in-progress: false

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: docs/phase-10-threaded-post-composer
          fetch-depth: 0
      - name: Reconcile canonical Phase 10 documentation
        shell: bash
        run: |
          set -euo pipefail
          node scripts/.tmp-reconcile-phase-10-docs.mjs
          node scripts/generate-documentation-authority-registry.js
          node scripts/check-documentation-authority.js
          rm scripts/.tmp-reconcile-phase-10-docs.mjs .github/workflows/.tmp-phase-10-doc-reconcile.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/architecture/README.md docs/architecture/IMPLEMENTATION_ROADMAP_V2.md docs/architecture/ARCHITECTURAL_DECISIONS.md config/documentation-authority-registry.json scripts/.tmp-reconcile-phase-10-docs.mjs .github/workflows/.tmp-phase-10-doc-reconcile.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "docs(phase-10): reconcile canonical architecture authorities"
          git push origin HEAD:docs/phase-10-threaded-post-composer
