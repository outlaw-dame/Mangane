name: Temporary PR89 final regeneration

on:
  push:
    branches:
      - feat/collections-starter-kits-embeds

permissions:
  contents: write

jobs:
  regenerate:
    if: ${{ !contains(github.event.head_commit.message, '[pr89-final-regenerated]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/collections-starter-kits-embeds
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: yarn install --immutable
      - name: Regenerate affected authorities
        run: |
          yarn generate:network-callsites
          yarn generate:html-safety
          yarn generate:telemetry
          yarn generate:design-authority
          yarn generate:architecture-boundaries
          yarn generate:documentation-authority
      - name: Remove temporary workflow and commit
        run: |
          rm .github/workflows/temp-pr89-final-regenerate.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "chore: regenerate PR89 final authorities [pr89-final-regenerated]"
          git push origin HEAD:feat/collections-starter-kits-embeds
