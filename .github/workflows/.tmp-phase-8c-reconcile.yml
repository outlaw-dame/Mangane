name: Temporary Phase 8C reconciliation

on:
  push:
    branches:
      - docs/phase-8c-shared-aggregation-shelf
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: write

concurrency:
  group: phase-8c-reconciliation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: docs/phase-8c-shared-aggregation-shelf
          persist-credentials: true
          fetch-depth: 1

      - name: Reconcile canonical documentation
        run: node scripts/.tmp-reconcile-phase-8c.mjs

      - name: Commit generated reconciliation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "docs: reconcile Phase 8C canonical authorities"
          git push origin HEAD:docs/phase-8c-shared-aggregation-shelf
