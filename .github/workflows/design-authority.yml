name: Design and accessibility authority

on:
  pull_request:
    paths:
      - 'app/soapbox/components/**'
      - 'app/soapbox/containers/**'
      - 'app/soapbox/features/**'
      - 'app/soapbox/pages/**'
      - 'app/styles/**'
      - 'config/component-ownership-manifest.json'
      - 'config/design-component-authority-inventory.json'
      - 'config/design-tokens.json'
      - 'config/icon-migration-baseline.json'
      - 'config/foundational-control-contracts.json'
      - 'docs/architecture/**'
      - 'scripts/**design**'
      - 'scripts/**icon**'
      - 'scripts/**token**'
      - 'scripts/**foundational**'
      - 'scripts/__tests__/check-design-component-authority-inventory.test.js'
      - 'tailwind/**'
      - 'tailwind.config.js'
      - 'package.json'
      - '.github/workflows/design-authority.yml'
  push:
    branches: [develop]
    paths:
      - 'app/soapbox/components/**'
      - 'app/soapbox/containers/**'
      - 'app/soapbox/features/**'
      - 'app/soapbox/pages/**'
      - 'app/styles/**'
      - 'config/component-ownership-manifest.json'
      - 'config/design-component-authority-inventory.json'
      - 'config/design-tokens.json'
      - 'config/icon-migration-baseline.json'
      - 'config/foundational-control-contracts.json'
      - 'scripts/**design**'
      - 'scripts/**icon**'
      - 'scripts/**token**'
      - 'scripts/**foundational**'
      - 'tailwind/**'
      - 'tailwind.config.js'

permissions:
  contents: write

jobs:
  reconcile-phase-3e:
    if: github.event_name == 'pull_request' && github.head_ref == 'phase-3e/framework7-icon-parity-and-closure' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: phase-3e/framework7-icon-parity-and-closure
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: corepack enable
      - run: yarn install --immutable --mode=skip-build
      - name: Regenerate governed inventories
        run: |
          yarn generate:icons
          yarn generate:design-authority
          yarn generate:documentation-authority
          yarn generate:architecture-boundaries
      - name: Verify regenerated authorities and types
        run: |
          node --test scripts/__tests__/f7-shell-icon-authority.test.js
          yarn typecheck
          yarn check:icons
          yarn check:design-authority
          yarn check:documentation-authority
          yarn check:architecture-boundaries
      - name: Restore trusted workflow and commit exact generated output
        run: |
          git checkout origin/main -- .github/workflows/design-authority.yml
          rm -f .github/workflows/temporary-phase-3e-reconcile.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "chore(shell): reconcile typed Phase 3E authorities"
          git push origin HEAD:phase-3e/framework7-icon-parity-and-closure

  design-authority:
    if: github.event_name != 'pull_request' || github.head_ref != 'phase-3e/framework7-icon-parity-and-closure' || github.actor == 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
      - name: Verify design, component, icon, interaction, and accessibility authority
        run: node scripts/check-design-component-authority-inventory.js
      - name: Run authority mutation tests
        run: node --test scripts/__tests__/check-design-component-authority-inventory.test.js
      - name: Verify semantic design tokens and compatibility aliases
        run: node scripts/check-design-tokens.js
      - name: Run design token contract tests
        run: node --test scripts/__tests__/design-token-foundation.test.js
      - name: Verify semantic icon registry and shrinking legacy baseline
        run: node scripts/check-icon-migration.js
      - name: Run semantic icon migration mutation tests
        run: node --test scripts/__tests__/icon-migration-foundation.test.js
      - name: Verify foundational controls, focus, motion, and state contracts
        run: node scripts/check-foundational-control-contracts.js
      - name: Run foundational control mutation tests
        run: node --test scripts/__tests__/foundational-control-contracts.test.js
